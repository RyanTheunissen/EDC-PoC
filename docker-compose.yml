services:
  provider:
    build:
      context: .
      dockerfile: provider/Dockerfile
    container_name: provider
    ports:
      - "19191:19191"
      - "19192:19192"
      - "19193:19193"
      - "19194:19194"
      - "19291:19291"
    environment:
      AWS_ACCESS_KEY_ID: consumer
      AWS_SECRET_ACCESS_KEY: password
    depends_on:
      - vault

  vault:
    container_name: vault
    image: hashicorp/vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "<root-token>"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-init:
    image: hashicorp/vault
    container_name: vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "<root-token>"
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      echo 'Waiting for Vault...';
      until vault status >/dev/null 2>&1; do
        sleep 1;
      done;
      echo 'Seeding secrets into Vault...';
      vault kv put secret/accessKeyId      content=consumer &&
      vault kv put secret/secretAccessKey  content=password &&
      vault kv put secret/provider-key     content=password;
      echo 'Vault init done.';
      "
    restart: "no"

  file-server:
    image: nginx:alpine
    container_name: file-server
    volumes:
      - /home/Dataspace/shared:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
