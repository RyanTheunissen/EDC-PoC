services:

  consumer:
    image: ryantheunissen/edc-poc-consumer:latest
    container_name: consumer
    ports:
      - "29191:29191" # /api
      - "29192:29192" # /control
      - "29193:29193" # /management
      - "29194:29194" # /protocol (DSP)
      - "29291:29291" # /public
    depends_on:
      - vault
      - minio
      - receiver

  minio:
    container_name: minio
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: consumer
      MINIO_ROOT_PASSWORD: password

  vault:
    container_name: vault
    image: hashicorp/vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "<root-token>"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-init:
    image: hashicorp/vault
    container_name: vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "<root-token>"
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      echo 'Waiting for Vault...';
      until vault status >/dev/null 2>&1; do
        sleep 1;
      done;
      echo 'Seeding secrets into Vault...';
      vault kv put secret/edc.aws.access.key         content=consumer &&
      vault kv put secret/edc.aws.secret.access.key  content=password &&
      vault kv put secret/provider-key               content=password;
      echo 'Vault init done.';
      "
    restart: "no"

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 consumer password;
      /usr/bin/mc mb dockerminio/src-bucket;
      exit 0;
      "
  receiver:
    build:
      context: ./receiver
      dockerfile: Dockerfile
    container_name: receiver
    depends_on:
      - minio
      - minio-init
    ports:
      - "7070:7070"
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "consumer"
      MINIO_SECRET_KEY: "password"
      MINIO_BUCKET: "src-bucket"
      MINIO_OBJECT: "test.csv"
    restart: on-failure