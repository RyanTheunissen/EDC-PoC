# Identity
edc.participant.id=provider1
edc.hostname=provider

# DSP Callback URL
edc.dsp.callback.address=http://100.93.225.17:19194/protocol

# Web API endpoints
web.http.port=19191
web.http.path=/api

web.http.management.port=19193
web.http.management.path=/management
web.http.management.auth.key=password

web.http.protocol.port=19194
web.http.protocol.path=/protocol

web.http.public.port=19291
web.http.public.path=/public

web.http.control.port=19192
web.http.control.path=/control

# Vault
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=<root-token>
edc.vault.hashicorp.api.secret.path=/v1/secret
edc.vault.hashicorp.health.check.enabled=false
edc.vault.hashicorp.secret.key=content

# Azure Blob Storage
edc.blobstore.endpoint.template=http://azurite:10000/%s

