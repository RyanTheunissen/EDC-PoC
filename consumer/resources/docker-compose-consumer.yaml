services:

  vault:
    container_name: vault
    image: hashicorp/vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "<root-token>"

  postgres:
    container_name: edc-poc-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: pocdb
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pocuser -d pocdb" ]
      interval: 10s
      timeout: 5s
      retries: 5